<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANU AARI MATERIALS</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- PWA Manifest Link -->
    <link rel="manifest" href="./manifest.json">
</head>
<body class="bg-gray-100 flex justify-center items-center h-screen m-0">

    <!-- Mobile Frame Container -->
    <div class="w-full max-w-md h-full sm:h-[850px] sm:rounded-3xl sm:shadow-2xl bg-white flex flex-col relative overflow-hidden">

        <!-- TOP HEADER -->
        <header class="bg-indigo-600 text-white p-3 flex justify-between items-center shadow-md z-10">
            <div>
                <h1 id="header-title" class="text-sm font-bold tracking-wide">ANU AARI MATERIALS</h1>
                <a href="tel:9840450113" class="text-[11px] text-indigo-100 flex items-center space-x-1 mt-0.5 hover:underline">
                    <i class="fa-solid fa-phone text-[10px]"></i>
                    <span>9840450113</span>
                </a>
            </div>
        </header>

        <!-- MAIN SCROLLABLE CONTENT AREA -->
        <main id="main-content" class="flex-1 overflow-y-auto pb-20 p-4">
            <div class="flex flex-col items-center justify-center h-full text-gray-400">
                <i class="fa-solid fa-spinner fa-spin text-3xl mb-2"></i>
                <p class="text-xs">Loading items from Google Sheet...</p>
            </div>
        </main>

        <!-- BOTTOM NAVIGATION BAR -->
        <nav class="absolute bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-around items-center h-16 shadow-lg z-10">
            <button onclick="switchTab('home')" id="nav-home" class="flex flex-col items-center text-indigo-600 transition">
                <i class="fa-solid fa-house text-xl"></i>
                <span class="text-xs mt-1">Home</span>
            </button>
            <button onclick="switchTab('categories')" id="nav-categories" class="flex flex-col items-center text-gray-400 hover:text-indigo-600 transition">
                <i class="fa-solid fa-layer-group text-xl"></i>
                <span class="text-xs mt-1">Categories</span>
            </button>
            <button onclick="switchTab('cart')" id="nav-cart" class="flex flex-col items-center text-gray-400 hover:text-indigo-600 transition relative">
                <i class="fa-solid fa-cart-shopping text-xl"></i>
                <span class="text-xs mt-1">Cart</span>
                <span id="cart-badge" class="absolute -top-1 right-2 bg-red-500 text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-bold hidden">0</span>
            </button>
        </nav>

    </div>

    <!-- JAVASCRIPT APP LOGIC -->
    <script>
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyftApEC3eQJvJPF0tCSX7eFwAG52IinpEhQtlxhmVaOtpbc1J83zJZIhs9XRDRCezCZA/exec";

        let currentTab = 'home';
        let cart = []; 
        let selectedSubcategoryFilter = 'All';
        let selectedCategory = null;
        let cachedProducts = [];
        let cachedCategories = [];
        let shuffledHomeProducts = []; // Stored so shuffle doesn't re-trigger on every quantity change

        function fetchSheetData() {
            fetch(GOOGLE_SCRIPT_URL)
                .then(res => res.json())
                .then(data => {
                    if (data.status === "success") {
                        cachedProducts = data.products || [];
                        cachedCategories = data.categories || [];
                        prepareHomeProducts();
                        renderContent();
                    } else {
                        console.error("Sheet error:", data.message);
                        document.getElementById('main-content').innerHTML = `<div class="text-center py-20 text-red-500 text-xs">Error loading sheet data: ${data.message}</div>`;
                    }
                })
                .catch(err => {
                    console.error("Failed to load from sheet:", err);
                    document.getElementById('main-content').innerHTML = `<div class="text-center py-20 text-red-500 text-xs">Failed to connect to Google Sheet. Check console for details.</div>`;
                });
        }

        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function prepareHomeProducts() {
            let filteredProducts = selectedSubcategoryFilter === 'All' 
                ? cachedProducts 
                : cachedProducts.filter(p => p.subcategory === selectedSubcategoryFilter);
            shuffledHomeProducts = shuffleArray(filteredProducts);
        }

        function switchTab(tab) {
            currentTab = tab;
            ['home', 'categories', 'cart'].forEach(t => {
                const btn = document.getElementById(`nav-${t}`);
                if (t === tab) {
                    btn.className = "flex flex-col items-center text-indigo-600 transition";
                } else {
                    btn.className = "flex flex-col items-center text-gray-400 hover:text-indigo-600 transition";
                }
            });
            renderContent();
        }

        function filterBySubcategory(subcat) {
            selectedSubcategoryFilter = subcat;
            prepareHomeProducts();
            switchTab('home');
        }

        function selectCategory(catName) {
            selectedCategory = catName;
            renderContent();
        }

        function getProductQuantity(productId) {
            const item = cart.find(i => i.id === productId);
            return item ? item.quantity : 0;
        }

        function renderContent() {
            const container = document.getElementById('main-content');

            if (currentTab === 'home') {
                container.innerHTML = `
                    <div class="space-y-4">
                        ${selectedSubcategoryFilter !== 'All' ? `
                            <div class="flex justify-between items-center bg-indigo-50 p-2 rounded-lg">
                                <span class="text-xs font-bold text-indigo-700 truncate">Subcategory: ${selectedSubcategoryFilter}</span>
                                <button onclick="filterBySubcategory('All')" class="text-xs text-indigo-600 font-semibold hover:underline whitespace-nowrap ml-2">Show All</button>
                            </div>
                        ` : ''}
                        
                        <div class="grid grid-cols-2 gap-3 pt-1">
                            ${shuffledHomeProducts.length === 0 ? `
                                <div class="col-span-2 text-center py-10 text-gray-400">
                                    <i class="fa-solid fa-box-open text-3xl mb-2"></i>
                                    <p class="text-xs">No items found.</p>
                                </div>
                            ` : shuffledHomeProducts.map(p => {
                                const qty = getProductQuantity(p.id);
                                return `
                                    <div class="bg-white border border-gray-200 rounded-xl p-3 flex flex-col justify-between shadow-sm">
                                        <img src="${p.image}" class="w-full h-28 object-cover rounded-lg mb-2 bg-gray-50">
                                        <h4 class="text-xs font-bold text-gray-800 truncate">${p.name}</h4>
                                        <span class="text-[10px] text-gray-400 truncate">${p.id}</span>
                                        <div class="flex justify-between items-center mt-2">
                                            <span class="text-indigo-600 font-bold text-sm">₹${p.price.toFixed(2)}</span>${qty === 0 ? `
                                                <button onclick="addToCart('${p.id}')" class="bg-indigo-600 text-white w-8 h-8 rounded-lg flex items-center justify-center hover:bg-indigo-700 transition">
                                                    <i class="fa-solid fa-plus text-xs"></i>
                                                </button>
                                            ` : `
                                                <div class="flex items-center space-x-1 bg-indigo-50 border border-indigo-200 rounded-lg p-1">
                                                    <button onclick="decreaseQuantity('${p.id}')" class="bg-white text-indigo-600 w-6 h-6 rounded flex items-center justify-center shadow-sm hover:bg-indigo-100 transition">
                                                        <i class="fa-solid fa-minus text-[10px]"></i>
                                                    </button>
                                                    <span class="text-xs font-bold text-indigo-700 px-1.5">${qty}</span>
                                                    <button onclick="increaseQuantity('${p.id}')" class="bg-indigo-600 text-white w-6 h-6 rounded flex items-center justify-center shadow-sm hover:bg-indigo-700 transition">
                                                        <i class="fa-solid fa-plus text-[10px]"></i>
                                                    </button>
                                                </div>
                                            `}
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
            } else if (currentTab === 'categories') {
                if (!selectedCategory) {
                    container.innerHTML = `
                        <div class="space-y-3">
                            <h3 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2">
                                <i class="fa-solid fa-folder text-amber-500 mr-1.5"></i> Categories
                            </h3>
                            <div class="grid grid-cols-1 gap-2.5">
                                ${cachedCategories.map(cat => `
                                    <div onclick="selectCategory('${cat.categoryName}')" class="bg-white border border-gray-200 rounded-xl p-4 text-left shadow-sm hover:border-indigo-500 transition cursor-pointer flex items-center justify-between">
                                        <div class="flex items-center space-x-3">
                                            <div class="w-10 h-10 bg-indigo-50 rounded-lg flex items-center justify-center text-indigo-600">
                                                <i class="fa-solid fa-folder-open"></i>
                                            </div>
                                            <span class="font-semibold text-gray-800 text-xs leading-relaxed">${cat.categoryName}</span>
                                        </div>
                                        <i class="fa-solid fa-chevron-right text-xs text-gray-400"></i>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                } else {
                    const matchedCat = cachedCategories.find(c => c.categoryName === selectedCategory);
                    const subcategories = matchedCat ? matchedCat.subcategories : [];

                    container.innerHTML = `
                        <div class="space-y-3">
                            <button onclick="selectCategory(null)" class="text-xs text-indigo-600 font-semibold flex items-center space-x-1 hover:underline mb-2">
                                <i class="fa-solid fa-arrow-left"></i>
                                <span>Back to Categories</span>
                            </button>
                            <h3 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-2 truncate">
                                <i class="fa-solid fa-tags text-indigo-600 mr-1.5"></i> ${selectedCategory}
                            </h3>
                            <div class="grid grid-cols-1 gap-2.5">
                                ${subcategories.map(sub => `
                                    <div onclick="filterBySubcategory('${sub}')" class="bg-white border border-gray-200 rounded-xl p-4 text-left shadow-sm hover:border-indigo-500 transition cursor-pointer flex items-center justify-between">
                                        <div class="flex items-center space-x-3">
                                            <div class="w-9 h-9 bg-indigo-50 rounded-lg flex items-center justify-center text-indigo-600">
                                                <i class="fa-solid fa-tag text-sm"></i>
                                            </div>
                                            <span class="font-semibold text-gray-800 text-xs">${sub}</span>
                                        </div>
                                        <i class="fa-solid fa-chevron-right text-xs text-gray-400"></i>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                }
            } else if (currentTab === 'cart') {
                if (cart.length === 0) {
                    container.innerHTML = `
                        <div class="flex flex-col items-center justify-center h-full text-center text-gray-400 space-y-3 pt-20">
                            <i class="fa-solid fa-cart-arrow-down text-5xl"></i>
                            <p class="text-sm">Your cart is empty</p>
                        </div>
                    `;
                } else {
                    const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0).toFixed(2);
                    container.innerHTML = `
                        <div class="space-y-3 flex flex-col h-full justify-between pb-10">
                            <div class="space-y-2 overflow-y-auto flex-1">
                                ${cart.map(item => `
                                    <div class="flex items-center justify-between bg-white border border-gray-200 p-3 rounded-xl shadow-sm">
                                        <div class="flex items-center space-x-3">
                                            <img src="${item.image}" class="w-12 h-12 object-cover rounded-lg">
                                            <div>
                                                <h4 class="text-xs font-bold text-gray-800">${item.name}</h4>
                                                <span class="text-indigo-600 font-semibold text-xs">₹${item.price.toFixed(2)} x ${item.quantity} = ₹${(item.price * item.quantity).toFixed(2)}</span>
                                            </div>
                                        </div>
                                        <div class="flex items-center space-x-1 bg-gray-50 border border-gray-200 rounded-lg p-1">
                                            <button onclick="decreaseQuantity('${item.id}')" class="text-gray-600 hover:text-red-500 w-6 h-6 flex items-center justify-center">
                                                <i class="fa-solid fa-minus text-[10px]"></i>
                                            </button>
                                            <span class="text-xs font-bold px-1.5">${item.quantity}</span>
                                            <button onclick="increaseQuantity('${item.id}')" class="text-gray-600 hover:text-indigo-600 w-6 h-6 flex items-center justify-center">
                                                <i class="fa-solid fa-plus text-[10px]"></i>
                                            </button>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                            <div class="bg-white border-t border-gray-200 pt-3">
                                <div class="flex justify-between font-bold text-gray-800 mb-3">
                                    <span>Total Amount:</span>
                                    <span class="text-indigo-600">₹${total}</span>
                                </div>
                                <button onclick="showCheckoutForm()" class="w-full bg-indigo-600 text-white py-3 rounded-xl font-semibold shadow hover:bg-indigo-700 transition">
                                    Proceed to Checkout
                                </button>
                            </div>
                        </div>
                    `;
                }
            }
        }

        function showCheckoutForm() {
            const container = document.getElementById('main-content');
            container.innerHTML = `
                <div class="space-y-3 pb-10">
                    <h2 class="text-sm font-bold text-gray-800 mb-2">Customer & Delivery Details</h2>
                    <div>
                        <label class="text-xs font-semibold text-gray-600">Full Name *</label>
                        <input type="text" id="cust-name" class="w-full border border-gray-300 rounded-lg p-2 text-xs mt-1 focus:outline-indigo-600" placeholder="Enter your name">
                    </div>
                    <div>
                        <label class="text-xs font-semibold text-gray-600">Primary Phone Number *</label>
                        <input type="tel" id="cust-phone" class="w-full border border-gray-300 rounded-lg p-2 text-xs mt-1 focus:outline-indigo-600" placeholder="9840450113">
                    </div>
                    <div>
                        <label class="text-xs font-semibold text-gray-600">Secondary Phone (Optional)</label>
                        <input type="tel" id="cust-sec-phone" class="w-full border border-gray-300 rounded-lg p-2 text-xs mt-1 focus:outline-indigo-600" placeholder="Alternative number">
                    </div>
                    <div>
                        <label class="text-xs font-semibold text-gray-600">Delivery Address *</label>
                        <textarea id="cust-address" class="w-full border border-gray-300 rounded-lg p-2 text-xs mt-1 focus:outline-indigo-600" rows="2" placeholder="House no, street, area"></textarea>
                    </div>
                    <div>
                        <label class="text-xs font-semibold text-gray-600">Special Instructions / Notes</label>
                        <input type="text" id="cust-desc" class="w-full border border-gray-300 rounded-lg p-2 text-xs mt-1 focus:outline-indigo-600" placeholder="Any specific requests">
                    </div>
                    <div class="pt-2 flex space-x-2">
                        <button onclick="switchTab('cart')" class="w-1/2 bg-gray-200 text-gray-700 py-2.5 rounded-xl text-xs font-semibold">Back</button>
                        <button onclick="submitOrderToSheet()" class="w-1/2 bg-green-600 text-white py-2.5 rounded-xl text-xs font-semibold shadow hover:bg-green-700">Place Order</button>
                    </div>
                </div>
            `;
        }

        function submitOrderToSheet() {
            const name = document.getElementById('cust-name').value.trim();
            const phone = document.getElementById('cust-phone').value.trim();
            const secPhone = document.getElementById('cust-sec-phone').value.trim();
            const address = document.getElementById('cust-address').value.trim();
            const desc = document.getElementById('cust-desc').value.trim();

            if (!name || !phone || !address) {
                alert("Please fill in all required fields (Name, Phone, Address).");
                return;
            }

            const itemsList = cart.map(item => `${item.name} (Qty: ${item.quantity}, ₹${item.price * item.quantity})`).join(', ');
            const timestamp = new Date().toLocaleString();

            const orderPayload = {
                Type: "Order",
                Timestamp: timestamp,
                Customer_Name: name,
                Primary_Phone: phone,
                Items: itemsList,
                Address: address,
                Secondary_Phone: secPhone,
                Description: desc
            };

            const loginPayload = {
                Type: "Login",
                Customer_Name: name,
                Primary_Phone: phone
            };

            alert("Submitting your order...");

            fetch(GOOGLE_SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(orderPayload)
            }).then(() => {
                return fetch(GOOGLE_SCRIPT_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(loginPayload)
                });
            }).then(() => {
                alert("Order placed successfully! Recorded in Google Sheets.");
                cart = [];
                updateCartBadge();
                prepareHomeProducts();
                switchTab('home');
            }).catch(err => {
                console.error("Error submitting order:", err);
                alert("Order submitted!");
                cart = [];
                updateCartBadge();
                prepareHomeProducts();
                switchTab('home');
            });
        }

        function addToCart(productId) {
            const product = cachedProducts.find(p => p.id === productId);
            if (product) {
                const existing = cart.find(i => i.id === productId);
                if (existing) {
                    existing.quantity += 1;
                } else {
                    cart.push({ ...product, quantity: 1 });
                }
                updateCartBadge();
                renderContent();
            }
        }

        function increaseQuantity(productId) {
            addToCart(productId);
        }

        function decreaseQuantity(productId) {
            const existingIndex = cart.findIndex(i => i.id === productId);
            if (existingIndex > -1) {
                if (cart[existingIndex].quantity > 1) {
                    cart[existingIndex].quantity -= 1;
                } else {
                    cart.splice(existingIndex, 1);
                }
                updateCartBadge();
                renderContent();
            }
        }

        function updateCartBadge() {
            const badge = document.getElementById('cart-badge');
            const totalCount = cart.reduce((sum, item) => sum + item.quantity, 0);
            if (totalCount > 0) {
                badge.innerText = totalCount;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        // Fetch Data on App Load
        fetchSheetData();
    </script>
</body>
</html>
