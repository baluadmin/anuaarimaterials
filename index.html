<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ANU AARI MATERIALS</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
        .hd-banner {
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }
    </style>
    <!-- PWA Manifest Link -->
    <link rel="manifest" href="./manifest.json">
</head>
<body class="bg-gradient-to-b from-sky-50 via-slate-50 to-blue-50 flex justify-center items-center h-[100dvh] w-screen overflow-hidden m-0">

    <!-- Responsive Container: Full screen on mobile, adaptable full screen layout on desktop -->
    <div class="w-full h-[100dvh] sm:w-screen sm:h-screen sm:rounded-none sm:shadow-none bg-white flex flex-col justify-between relative overflow-hidden border-0 sm:border-none text-slate-800">

        <!-- TOP BANNER AREA -->
        <header id="app-header" class="bg-amber-500 text-slate-950 p-2 pb-0 flex flex-col shadow-md z-30 shrink-0">
            <!-- FULL WIDTH HD BANNER CONTAINER -->
            <div class="w-full relative rounded-xl overflow-hidden shadow-sm bg-white border border-amber-600/35 h-36 sm:h-48 flex items-center justify-center">
                <img src="images/banner1.png" alt="Store Banner" class="w-full h-full object-cover hd-banner" onerror="this.src='https://placehold.co/800x300/ffffff/d97706?text=ANU+AARI+MATERIALS';">
            </div>
            <!-- Hidden elements for script state -->
            <button id="header-back-btn" onclick="handleHeaderBack()" class="hidden"></button>
            <h1 id="header-title" class="hidden"></h1>
            <a id="header-phone" class="hidden"></a>
        </header>

        <!-- SEARCH BAR -->
        <div id="search-container" class="bg-amber-500 px-3 pb-3 pt-2 z-30 shrink-0 shadow-md">
            <div class="relative max-w-3xl mx-auto">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-zinc-400">
                    <i class="fa-solid fa-search text-xs"></i>
                </span>
                <input type="text" id="search-input" oninput="handleSearch(this.value)" placeholder="Search aari materials, beads, threads..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" class="w-full pl-10 pr-10 py-2.5 bg-white/95 border border-amber-600/30 rounded-2xl text-xs sm:text-sm focus:outline-none shadow-sm text-slate-800 placeholder-zinc-400 font-medium">
                <button id="search-clear-btn" onclick="clearSearch()" class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-zinc-400 hover:text-zinc-600 hidden">
                    <i class="fa-solid fa-xmark text-xs"></i>
                </button>
            </div>
        </div>

        <!-- STABLE SUB-HEADER BAR -->
        <div id="subheader-container" class="bg-slate-50 border-b border-slate-200 px-4 py-2.5 z-20 shrink-0 hidden flex items-center justify-between shadow-sm">
            <button onclick="handleHeaderBack()" class="text-xs sm:text-sm text-amber-600 font-bold flex items-center space-x-1 hover:underline">
                <i class="fa-solid fa-arrow-left"></i>
                <span id="subheader-back-text">Back</span>
            </button>
            <span id="subheader-title" class="text-xs sm:text-sm font-bold text-slate-700 uppercase truncate ml-2"></span>
        </div>

        <!-- MAIN SCROLLABLE CONTENT AREA -->
        <main id="main-content" class="flex-1 overflow-y-auto p-3 sm:p-6 pt-2 bg-gradient-to-b from-sky-50/40 via-slate-50 to-blue-50/40">
            <!-- Welcome Loading Screen -->
            <div class="flex flex-col items-center justify-center h-full text-center space-y-4 px-6">
                <div class="w-14 h-14 bg-amber-500/10 border border-amber-500/20 rounded-2xl flex items-center justify-center text-amber-600 shadow-sm">
                    <i class="fa-solid fa-store text-xl"></i>
                </div>
                <div class="space-y-1">
                    <h2 class="text-xs font-bold text-slate-700 tracking-wider">WELCOME TO ANU AARI MATERIALS</h2>
                    <p class="text-[11px] text-slate-400 font-medium">LOADING STORE...</p>
                </div>
                <div class="w-6 h-6 border-2 border-amber-500 border-t-transparent rounded-full animate-spin mt-2"></div>
            </div>
        </main>

        <!-- FLOATING TOAST NOTIFICATION -->
        <div id="toast" class="absolute bottom-20 left-1/2 transform -translate-x-1/2 bg-slate-900 text-amber-400 text-xs sm:text-sm px-4 py-2.5 rounded-2xl shadow-xl transition-all duration-300 opacity-0 pointer-events-none z-50 font-medium border border-amber-500/30">
            Notification message
        </div>

        <!-- BOTTOM NAVIGATION BAR -->
        <nav id="bottom-nav" class="bg-white/95 backdrop-blur-md border-t border-slate-200 flex justify-around items-center h-16 shadow-lg z-30 shrink-0">
            <button onclick="switchTab('home')" id="nav-home" class="flex flex-col items-center text-amber-600 transition">
                <i class="fa-solid fa-house text-lg"></i>
                <span class="text-[10px] sm:text-xs mt-1 font-semibold">Home</span>
            </button>
            <button onclick="switchTab('categories')" id="nav-categories" class="flex flex-col items-center text-slate-400 hover:text-amber-600 transition">
                <i class="fa-solid fa-layer-group text-lg"></i>
                <span class="text-[10px] sm:text-xs mt-1 font-semibold">Categories</span>
            </button>
            <button onclick="switchTab('cart')" id="nav-cart" class="flex flex-col items-center text-slate-400 hover:text-amber-600 transition relative">
                <i class="fa-solid fa-cart-shopping text-lg"></i>
                <span class="text-[10px] sm:text-xs mt-1 font-semibold">Cart</span>
                <span id="cart-badge" class="absolute -top-1 right-2 bg-amber-500 text-slate-950 text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-bold hidden shadow-sm">0</span>
            </button>
        </nav>

    </div>

    <!-- PRODUCT IMAGE MODAL -->
    <div id="image-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4" onclick="closeImageModal()">
        <div class="bg-white border border-slate-200 rounded-3xl max-w-sm w-full p-5 relative text-center shadow-2xl" onclick="event.stopPropagation()">
            <button onclick="closeImageModal()" class="absolute top-3 right-4 text-slate-400 hover:text-slate-600 text-sm w-7 h-7 rounded-full bg-slate-100 flex items-center justify-center transition">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <img id="modal-img" src="" class="w-full h-56 object-contain rounded-2xl mb-4 bg-slate-50 shadow-inner" onerror="this.src='https://placehold.co/400x300/f8fafc/fbbf24?text=ANU+AARI';">
            <h3 id="modal-title" class="text-xs sm:text-sm font-bold text-slate-800 mb-1 leading-snug text-center"></h3>
            <p id="modal-id" class="text-[10px] sm:text-xs text-slate-400 mb-3 font-mono text-center"></p>
            <span id="modal-price" class="text-amber-600 font-extrabold text-sm sm:text-base block text-center"></span>
        </div>
    </div>

    <!-- JAVASCRIPT APP LOGIC -->
    <script>
        const BASE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyftApEC3eQJvJPF0tCSX7eFwAG52IinpEhQtlxhmVaOtpbc1J83zJZIhs9XRDRCezCZA/exec";
        const GOOGLE_SCRIPT_URL = `${BASE_SCRIPT_URL}?v=${Date.now()}`;

        let currentTab = 'home';
        let cart = []; 
        let selectedSubcategoryFilter = 'All';
        let selectedCategory = null;
        let selectedSubcategory = null;
        let searchQuery = '';
        
        let cachedProducts = [];
        let cachedCategories = [];
        let shuffledHomeProducts = [];

        function resolveImageUrl(imageName) {
            if (!imageName || String(imageName).trim() === '') {
                return '';
            }
            let clean = String(imageName).trim();
            if (clean.startsWith('http://') || clean.startsWith('https://')) {
                return clean;
            }
            clean = clean.replace(/^\.?\/*/, '');
            if (!clean.startsWith('images/')) {
                clean = 'images/' + clean;
            }
            return encodeURI(clean);
        }

        function getProductId(product, index = 0) {
            if (!product) return "item_" + index;
            const rawId = product.id || product.Item_ID || product.item_id || product.ID || product['Item_ID'] || product.sku || product.SKU || "";
            if (String(rawId).trim() !== "") {
                return String(rawId).trim();
            }
            return String(getDisplayName(product) + "_" + index).trim();
        }

        function getDisplayName(product) {
            if (!product) return "Item";
            const name = product.Product || product.product || product.PRODUCTS || product.Products || product.productName || product.name || product.Name || product.Item_Name;
            if (name && String(name).trim() !== "") {
                return String(name).trim();
            }
            for (let key in product) {
                if (key.toLowerCase().includes('product') || key.toLowerCase().includes('name')) {
                    if (product[key] && String(product[key]).trim() !== "") {
                        return String(product[key]).trim();
                    }
                }
            }
            return "Item";
        }

        function getProductPrice(product) {
            const raw = product.price !== undefined ? product.price : (product['Price (INR)'] !== undefined ? product['Price (INR)'] : (product.Price !== undefined ? product.Price : (product['price (inr)'] !== undefined ? product['price (inr)'] : 0)));
            const num = parseFloat(raw);
            return isNaN(num) ? 0 : num;
        }

        function getProductSubcategory(product) {
            return product.subcategory || product.Subcategory || product.SUBCATEGORY || product['Subcategory'] || "";
        }

        function getProductCategory(product) {
            return product.category || product.Category || product.CATEGORY || product['Category'] || "";
        }

        function getProductImage(product) {
            if (!product) return "";
            return product.images || product.Image || product.IMAGE || product.Images || product.image || "";
        }

        function initApp() {
            const timeoutId = setTimeout(() => {
                const container = document.getElementById('main-content');
                if (container && container.innerHTML.includes('animate-spin')) {
                    container.innerHTML = `
                        <div class="flex flex-col items-center justify-center h-full text-center text-amber-600 text-xs p-6 space-y-3">
                            <i class="fa-solid fa-triangle-exclamation text-2xl"></i>
                            <p class="font-bold">Connection is taking longer than expected.</p>
                            <button onclick="initApp()" class="mt-2 bg-amber-500 text-slate-950 px-4 py-2 rounded-2xl font-bold shadow-sm hover:bg-amber-400 transition">Retry Connection</button>
                        </div>
                    `;
                }
            }, 20000);

            fetch(GOOGLE_SCRIPT_URL)
                .then(res => res.json())
                .then(data => {
                    clearTimeout(timeoutId);
                    if (data.status === "success") {
                        cachedProducts = data.products || [];
                        cachedCategories = data.categories || [];
                        loadCart();
                        prepareHomeProducts();
                        switchTab('home');
                    } else {
                        document.getElementById('main-content').innerHTML = `
                            <div class="flex flex-col items-center justify-center h-full text-center text-red-500 text-xs p-6">
                                <i class="fa-solid fa-triangle-exclamation text-2xl mb-2"></i>
                                <p>Error loading sheet data: ${data.message}</p>
                                <button onclick="initApp()" class="mt-2 bg-amber-500 text-slate-950 px-4 py-2 rounded-2xl font-bold shadow-sm">Retry</button>
                            </div>
                        `;
                    }
                })
                .catch(err => {
                    clearTimeout(timeoutId);
                    console.error("Failed to load from sheet:", err);
                    document.getElementById('main-content').innerHTML = `
                        <div class="flex flex-col items-center justify-center h-full text-center text-red-500 text-xs p-6">
                            <i class="fa-solid fa-triangle-exclamation text-2xl mb-2"></i>
                            <p>Failed to connect to Google Sheet. Please check your connection or URL.</p>
                            <button onclick="initApp()" class="mt-2 bg-amber-500 text-slate-950 px-4 py-2 rounded-2xl font-bold shadow-sm">Retry</button>
                        </div>
                    `;
                });
        }

        function loadCart() {
            const savedCart = localStorage.getItem('anu_aari_cart_guest');
            if (savedCart) {
                try {
                    cart = JSON.parse(savedCart);
                } catch (e) {
                    cart = [];
                }
            } else {
                cart = [];
            }
            updateCartBadge();
        }

        function saveCart() {
            localStorage.setItem('anu_aari_cart_guest', JSON.stringify(cart));
        }

        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function prepareHomeProducts() {
            let filtered = cachedProducts;
            
            if (selectedSubcategoryFilter !== 'All') {
                filtered = filtered.filter(p => {
                    const sub = getProductSubcategory(p);
                    return sub === selectedSubcategoryFilter;
                });
            }

            if (searchQuery.trim() !== '') {
                const q = searchQuery.toLowerCase();
                filtered = filtered.filter(p => {
                    const name = getDisplayName(p).toLowerCase();
                    const id = String(getProductId(p)).toLowerCase();
                    const subcat = String(getProductSubcategory(p)).toLowerCase();
                    return name.includes(q) || id.includes(q) || subcat.includes(q);
                });
            }

            shuffledHomeProducts = shuffleArray(filtered);
        }

        function handleSearch(query) {
            searchQuery = query;
            const clearBtn = document.getElementById('search-clear-btn');
            if (query.trim() !== '') {
                clearBtn.classList.remove('hidden');
            } else {
                clearBtn.classList.add('hidden');
            }
            prepareHomeProducts();
            renderContent();
        }

        function clearSearch() {
            const input = document.getElementById('search-input');
            if (input) {
                input.value = '';
            }
            searchQuery = '';
            document.getElementById('search-clear-btn').classList.add('hidden');
            prepareHomeProducts();
            renderContent();
        }

        function updateHeaderTitle() {
            const subheaderContainer = document.getElementById('subheader-container');
            const subheaderTitle = document.getElementById('subheader-title');
            const subheaderBackText = document.getElementById('subheader-back-text');

            if (currentTab === 'home') {
                subheaderContainer.classList.add('hidden');
            } else if (currentTab === 'cart') {
                subheaderContainer.classList.add('hidden');
            } else if (currentTab === 'categories') {
                if (selectedSubcategory) {
                    subheaderContainer.classList.remove('hidden');
                    subheaderTitle.innerText = selectedSubcategory;
                    subheaderBackText.innerText = "Back to Subcategories";
                } else if (selectedCategory) {
                    subheaderContainer.classList.remove('hidden');
                    subheaderTitle.innerText = selectedCategory;
                    subheaderBackText.innerText = "Back to Categories";
                } else {
                    subheaderContainer.classList.add('hidden');
                }
            }
        }

        function handleHeaderBack() {
            if (selectedSubcategory) {
                selectedSubcategory = null;
            } else if (selectedCategory) {
                selectedCategory = null;
            }
            updateHeaderTitle();
            renderContent();
        }

        function switchTab(tab) {
            currentTab = tab;
            selectedCategory = null;
            selectedSubcategory = null;

            ['home', 'categories', 'cart'].forEach(t => {
                const btn = document.getElementById(`nav-${t}`);
                if (t === tab) {
                    btn.className = "flex flex-col items-center text-amber-600 transition";
                } else {
                    btn.className = "flex flex-col items-center text-slate-400 hover:text-amber-600 transition";
                }
            });

            const searchContainer = document.getElementById('search-container');
            if (tab === 'home') {
                searchContainer.classList.remove('hidden');
            } else {
                searchContainer.classList.add('hidden');
            }

            updateHeaderTitle();
            renderContent();
        }

        function selectCategory(catName) {
            selectedCategory = catName;
            selectedSubcategory = null;
            updateHeaderTitle();
            renderContent();
        }

        function selectSubcategory(subcatName) {
            selectedSubcategory = subcatName;
            updateHeaderTitle();
            renderContent();
        }

        function filterBySubcategory(subcat) {
            selectedSubcategoryFilter = subcat;
            prepareHomeProducts();
            switchTab('home');
        }

        function getProductQuantity(productId) {
            const item = cart.find(i => getProductId(i) === productId);
            return item ? item.quantity : 0;
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.classList.remove('opacity-0');
            toast.classList.add('opacity-100');
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0');
            }, 2000);
        }

        function openImageModal(name, id, price, image) {
            document.getElementById('modal-img').src = image || 'https://placehold.co/400x300/f8fafc/fbbf24?text=ANU+AARI';
            document.getElementById('modal-title').innerText = name;
            document.getElementById('modal-id').innerText = id;
            document.getElementById('modal-price').innerText = `₹${price.toFixed(2)}`;
            document.getElementById('image-modal').classList.remove('hidden');
        }

        function closeImageModal() {
            document.getElementById('image-modal').classList.add('hidden');
        }

        function renderContent() {
            updateHeaderTitle();
            const container = document.getElementById('main-content');

            if (currentTab === 'home') {
                container.innerHTML = `
                    <div class="space-y-3 pb-2 max-w-5xl mx-auto">
                        ${selectedSubcategoryFilter !== 'All' ? `
                            <div class="flex justify-between items-center bg-amber-500/10 border border-amber-500/30 p-2.5 rounded-2xl shadow-sm mb-2">
                                <span class="text-xs sm:text-sm font-semibold text-amber-800 truncate">Filter: ${selectedSubcategoryFilter}</span>
                                <button onclick="filterBySubcategory('All')" class="text-xs sm:text-sm text-amber-700 font-bold hover:underline whitespace-nowrap ml-2 flex items-center">
                                    <i class="fa-solid fa-xmark mr-1"></i> Clear
                                </button>
                            </div>
                        ` : ''}

                        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                            ${shuffledHomeProducts.length === 0 ? `
                                <div class="col-span-full text-center py-20 text-slate-400">
                                    <i class="fa-solid fa-box-open text-4xl mb-2 text-slate-300"></i>
                                    <p class="text-xs sm:text-sm font-medium">No materials found.</p>
                                </div>
                            ` : shuffledHomeProducts.map((p, index) => {
                                const id = getProductId(p, index);
                                const qty = getProductQuantity(id);
                                const displayName = getDisplayName(p);
                                const price = getProductPrice(p);
                                const subcat = getProductSubcategory(p);
                                const imgSrc = resolveImageUrl(getProductImage(p));
                                
                                return `
                                    <div class="bg-white border border-slate-200 rounded-3xl p-3.5 flex flex-col justify-between shadow-sm hover:border-amber-400 transition">
                                        <div onclick="openImageModal('${displayName.replace(/'/g, "\\'")}', '${id}', ${price}, '${imgSrc}')" class="cursor-pointer">
                                            ${imgSrc ? `
                                                <img src="${imgSrc}" onerror="this.parentElement.innerHTML='<div class=\'w-full h-44 bg-slate-50 rounded-2xl mb-2.5 flex items-center justify-center text-amber-500/40 border border-slate-100 shadow-inner\'><i class=\'fa-solid fa-image text-3xl\'></i></div>'" class="w-full h-44 object-contain rounded-2xl mb-2.5 bg-slate-50 shadow-inner">
                                            ` : `
                                                <div class="w-full h-44 bg-slate-50 rounded-2xl mb-2.5 flex items-center justify-center text-amber-500/40 border border-slate-100 shadow-inner">
                                                    <i class="fa-solid fa-image text-3xl"></i>
                                                </div>
                                            `}
                                        </div>
                                        <div class="flex flex-col items-center justify-center text-center px-1">
                                            <h4 class="text-xs sm:text-sm font-bold text-slate-800 leading-snug line-clamp-2 break-words text-center" title="${displayName}">${displayName}</h4>
                                            <div class="flex items-center justify-center space-x-1 text-[10px] sm:text-xs text-slate-400 truncate font-mono mt-0.5 w-full text-center">
                                                <span>${id}</span>${subcat ? `<span class="text-slate-300">•</span><span class="truncate">${subcat}</span>` : ''}
                                            </div>
                                        </div>
                                        <div class="flex justify-between items-center mt-2.5 pt-2 border-t border-slate-100">
                                            <span class="text-amber-600 font-extrabold text-sm sm:text-base">₹${price.toFixed(2)}</span>
                                            
                                            <div class="flex items-center space-x-1.5 bg-slate-50 border border-slate-200 rounded-2xl p-1">
                                                <button onclick="decreaseQuantity('${id}')" class="bg-white text-amber-600 w-7 h-7 sm:w-8 sm:h-8 rounded-xl flex items-center justify-center shadow-sm hover:bg-slate-100 transition active:scale-95">
                                                    <i class="fa-solid fa-minus text-[10px]"></i>
                                                </button>
                                                <span class="text-xs sm:text-sm font-bold text-slate-700 px-2">${qty}</span>
                                                <button onclick="increaseQuantity('${id}')" class="bg-amber-500 text-slate-950 w-7 h-7 sm:w-8 sm:h-8 rounded-xl flex items-center justify-center shadow-sm hover:bg-amber-400 transition active:scale-95">
                                                    <i class="fa-solid fa-plus text-[10px]"></i>
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
            } else if (currentTab === 'categories') {
                let categoriesList = cachedCategories;
                if (!categoriesList || categoriesList.length === 0) {
                    let catMap = {};
                    cachedProducts.forEach(p => {
                        let cat = getProductCategory(p) || "General";
                        let sub = getProductSubcategory(p) || "All";
                        if (!catMap[cat]) catMap[cat] = new Set();
                        if (sub) catMap[cat].add(sub);
                    });
                    categoriesList = Object.keys(catMap).map(c => ({
                        categoryName: c,
                        subcategories: Array.from(catMap[c])
                    }));
                }

                if (!selectedCategory) {
                    container.innerHTML = `
                        <div class="space-y-3 pb-2 max-w-3xl mx-auto">
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                ${categoriesList.map(cat => {
                                    const catName = cat.categoryName || cat.Category || "Category";
                                    const catProducts = cachedProducts.filter(p => getProductCategory(p) === catName || getProductSubcategory(p) === catName);
                                    let catImage = cat.image || '';
                                    if (!catImage && catProducts.length > 0) {
                                        const shuffledCatProducts = shuffleArray(catProducts);
                                        catImage = getProductImage(shuffledCatProducts[0]);
                                    }
                                    const catImgSrc = resolveImageUrl(catImage);

                                    return `
                                        <div onclick="selectCategory('${catName}')" class="bg-white border border-slate-200 rounded-3xl p-3.5 text-left shadow-sm hover:border-amber-400 transition cursor-pointer flex items-center justify-between group">
                                            <div class="flex items-center space-x-3.5">
                                                <div class="w-12 h-12 bg-slate-50 border border-slate-200 rounded-2xl overflow-hidden flex items-center justify-center text-amber-600 shadow-inner group-hover:scale-105 transition">
                                                    ${catImgSrc ? `<img src="${catImgSrc}" onerror="this.onerror=null; this.parentNode.innerHTML='<i class=\'fa-solid fa-folder-open\'></i>'" class="w-full h-full object-contain bg-slate-50">` : `<i class="fa-solid fa-folder-open"></i>`}
                                                </div>
                                                <span class="font-bold text-slate-800 text-xs sm:text-sm">${catName}</span>
                                            </div>
                                            <i class="fa-solid fa-chevron-right text-xs text-slate-300 group-hover:text-amber-500 transition pr-1"></i>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    `;
                } else if (!selectedSubcategory) {
                    const matchedCat = categoriesList.find(c => (c.categoryName || c.Category) === selectedCategory);
                    const subcategories = matchedCat ? (matchedCat.subcategories || matchedCat.Subcategories || []) : [];

                    container.innerHTML = `
                        <div class="space-y-3 pb-2 max-w-3xl mx-auto">
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                ${subcategories.map(sub => {
                                    const subProducts = cachedProducts.filter(p => getProductSubcategory(p) === sub);
                                    let subImage = '';
                                    if (subProducts.length > 0) {
                                        const shuffledSubProducts = shuffleArray(subProducts);
                                        subImage = getProductImage(shuffledSubProducts[0]);
                                    }
                                    const subImgSrc = resolveImageUrl(subImage);

                                    return `
                                        <div onclick="selectSubcategory('${sub}')" class="bg-white border border-slate-200 rounded-3xl p-3.5 text-left shadow-sm hover:border-amber-400 transition cursor-pointer flex items-center justify-between group">
                                            <div class="flex items-center space-x-3.5">
                                                <div class="w-12 h-12 bg-slate-50 border border-slate-200 rounded-2xl overflow-hidden flex items-center justify-center text-amber-600 shadow-inner group-hover:scale-105 transition">
                                                    ${subImgSrc ? `<img src="${subImgSrc}" onerror="this.onerror=null; this.parentNode.innerHTML='<i class=\'fa-solid fa-tag text-sm\'></i>'" class="w-full h-full object-contain bg-slate-50">` : `<i class="fa-solid fa-tag text-sm"></i>`}
                                                </div>
                                                <span class="font-bold text-slate-800 text-xs sm:text-sm">${sub}</span>
                                            </div>
                                            <i class="fa-solid fa-chevron-right text-xs text-slate-300 group-hover:text-amber-500 transition pr-1"></i>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    `;
                } else {
                    const subcategoryProducts = cachedProducts.filter(p => getProductSubcategory(p) === selectedSubcategory);

                    container.innerHTML = `
                        <div class="space-y-3 pb-2 max-w-5xl mx-auto">
                            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                                ${subcategoryProducts.length === 0 ? `
                                    <div class="col-span-full text-center py-20 text-slate-400">
                                        <i class="fa-solid fa-box-open text-4xl mb-2 text-slate-300"></i>
                                        <p class="text-xs sm:text-sm font-medium">No products found in this subcategory.</p>
                                    </div>
                                ` : subcategoryProducts.map((p, index) => {
                                    const id = getProductId(p, index);
                                    const qty = getProductQuantity(id);
                                    const displayName = getDisplayName(p);
                                    const price = getProductPrice(p);
                                    const subcat = getProductSubcategory(p);
                                    const imgSrc = resolveImageUrl(getProductImage(p));
                                    return `
                                        <div class="bg-white border border-slate-200 rounded-3xl p-3.5 flex flex-col justify-between shadow-sm hover:border-amber-400 transition">
                                            <div onclick="openImageModal('${displayName.replace(/'/g, "\\'")}', '${id}', ${price}, '${imgSrc}')" class="cursor-pointer">
                                                ${imgSrc ? `
                                                    <img src="${imgSrc}" onerror="this.parentElement.innerHTML='<div class=\'w-full h-44 bg-slate-50 rounded-2xl mb-2.5 flex items-center justify-center text-amber-500/40 border border-slate-100 shadow-inner\'><i class=\'fa-solid fa-image text-3xl\'></i></div>'" class="w-full h-44 object-contain rounded-2xl mb-2.5 bg-slate-50 shadow-inner">
                                                ` : `
                                                    <div class="w-full h-44 bg-slate-50 rounded-2xl mb-2.5 flex items-center justify-center text-amber-500/40 border border-slate-100 shadow-inner">
                                                        <i class="fa-solid fa-image text-3xl"></i>
                                                    </div>
                                                `}
                                            </div>
                                            <div class="flex flex-col items-center justify-center text-center px-1">
                                                <h4 class="text-xs sm:text-sm font-bold text-slate-800 leading-snug line-clamp-2 break-words text-center" title="${displayName}">${displayName}</h4>
                                                <div class="flex items-center justify-center space-x-1 text-[10px] sm:text-xs text-slate-400 truncate font-mono mt-0.5 w-full text-center">
                                                    <span>${id}</span>${subcat ? `<span class="text-slate-300">•</span><span class="truncate">${subcat}</span>` : ''}
                                                </div>
                                            </div>
                                            <div class="flex justify-between items-center mt-2.5 pt-2 border-t border-slate-100">
                                                <span class="text-amber-600 font-extrabold text-sm sm:text-base">₹${price.toFixed(2)}</span>
                                                <div class="flex items-center space-x-1.5 bg-slate-50 border border-slate-200 rounded-2xl p-1">
                                                    <button onclick="decreaseQuantity('${id}')" class="bg-white text-amber-600 w-7 h-7 sm:w-8 sm:h-8 rounded-xl flex items-center justify-center shadow-sm hover:bg-slate-100 transition active:scale-95">
                                                        <i class="fa-solid fa-minus text-[10px]"></i>
                                                    </button>
                                                    <span class="text-xs sm:text-sm font-bold text-slate-700 px-2">${qty}</span>
                                                    <button onclick="increaseQuantity('${id}')" class="bg-amber-500 text-slate-950 w-7 h-7 sm:w-8 sm:h-8 rounded-xl flex items-center justify-center shadow-sm hover:bg-amber-400 transition active:scale-95">
                                                        <i class="fa-solid fa-plus text-[10px]"></i>
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>
                    `;
                }
            } else if (currentTab === 'cart') {
                if (cart.length === 0) {
                    container.innerHTML = `
                        <div class="flex flex-col items-center justify-center h-full text-center text-slate-400 space-y-3 pt-20 pb-2">
                            <div class="w-20 h-20 bg-amber-500/15 border border-amber-500/30 rounded-3xl flex items-center justify-center text-amber-600 mb-1 shadow-sm">
                                <i class="fa-solid fa-cart-shopping text-3xl"></i>
                            </div>
                            <p class="text-sm sm:text-base font-bold text-slate-800">Your cart is empty</p>
                            <p class="text-xs sm:text-sm text-slate-400 max-w-xs">Add items from the home screen to place your order.</p>
                        </div>
                    `;
                } else {
                    const total = cart.reduce((sum, item) => sum + (getProductPrice(item) * item.quantity), 0).toFixed(2);
                    container.innerHTML = `
                        <div class="space-y-3 flex flex-col h-full justify-between pb-2 max-w-2xl mx-auto w-full">
                            <div class="space-y-2.5 overflow-y-auto flex-1 pr-1">
                                ${cart.map(item => {
                                    const displayName = getDisplayName(item);
                                    const price = getProductPrice(item);
                                    const id = getProductId(item);
                                    const imgSrc = resolveImageUrl(getProductImage(item));
                                    return `
                                    <div class="flex items-center justify-between bg-white border border-slate-200 p-3.5 rounded-3xl shadow-sm">
                                        <div class="flex items-center space-x-3.5">
                                            ${imgSrc ? `
                                                <img src="${imgSrc}" onerror="this.onerror=null; this.parentNode.innerHTML='<div class=\'w-12 h-12 bg-slate-50 rounded-2xl flex items-center justify-center text-amber-500/40 border border-slate-100 shadow-inner\'><i class=\'fa-solid fa-image\'></i></div>'" class="w-12 h-12 object-contain rounded-2xl bg-slate-50 shadow-inner">
                                            ` : `
                                                <div class="w-12 h-12 bg-slate-50 rounded-2xl flex items-center justify-center text-amber-500/40 border border-slate-100 shadow-inner">
                                                    <i class="fa-solid fa-image"></i>
                                                </div>
                                            `}
                                            <div>
                                                <h4 class="text-xs sm:text-sm font-bold text-slate-800 leading-snug">${displayName}</h4>
                                                <span class="text-amber-600 font-semibold text-xs sm:text-sm">₹${price.toFixed(2)} × ${item.quantity} = ₹${(price * item.quantity).toFixed(2)}</span>
                                            </div>
                                        </div>
                                        <div class="flex items-center space-x-1 bg-slate-50 border border-slate-200 rounded-2xl p-1">
                                            <button onclick="decreaseQuantity('${id}')" class="text-amber-600 hover:text-amber-700 w-6 h-6 rounded-xl flex items-center justify-center transition">
                                                <i class="fa-solid fa-minus text-[10px]"></i>
                                            </button>
                                            <span class="text-xs sm:text-sm font-bold px-1.5 text-slate-700">${item.quantity}</span>
                                            <button onclick="increaseQuantity('${id}')" class="text-amber-600 hover:text-amber-700 w-6 h-6 rounded-xl flex items-center justify-center transition">
                                                <i class="fa-solid fa-plus text-[10px]"></i>
                                            </button>
                                        </div>
                                    </div>
                                    `;
                                }).join('')}
                            </div>
                            <div class="bg-white border border-slate-200 p-4 rounded-3xl shadow-sm shrink-0">
                                <div class="flex justify-between font-bold text-slate-800 mb-3 text-xs sm:text-sm">
                                    <span>Total Amount:</span>
                                    <span class="text-amber-600 text-base sm:text-lg">₹${total}</span>
                                </div>
                                <button onclick="showCheckoutForm()" class="w-full bg-amber-500 text-slate-950 py-3.5 rounded-2xl font-bold shadow-md hover:bg-amber-400 transition active:scale-[0.99] text-xs sm:text-sm">
                                    Proceed to Checkout
                                </button>
                            </div>
                        </div>
                    `;
                }
            }
        }

        function showCheckoutForm() {
            const container = document.getElementById('main-content');
            container.innerHTML = `
                <div class="space-y-3 pb-2 max-w-xl mx-auto w-full">
                    <h2 class="text-xs sm:text-sm font-bold text-slate-700 uppercase tracking-wider mb-2">Customer & Delivery Details</h2>
                    <div class="bg-white border border-slate-200 p-5 rounded-3xl shadow-sm space-y-3">
                        <div>
                            <label class="text-[11px] font-bold text-slate-500 uppercase tracking-wider">Full Name *</label>
                            <input type="text" id="cust-name" autocomplete="off" class="w-full border border-slate-200 rounded-2xl p-3 text-xs sm:text-sm mt-1 bg-slate-50 focus:bg-white focus:outline-amber-500 transition font-medium text-slate-800">
                        </div>
                        <div>
                            <label class="text-[11px] font-bold text-slate-500 uppercase tracking-wider">Primary Phone Number *</label>
                            <input type="tel" id="cust-phone" autocomplete="off" class="w-full border border-slate-200 rounded-2xl p-3 text-xs sm:text-sm mt-1 bg-slate-50 focus:bg-white focus:outline-amber-500 transition font-medium text-slate-800">
                        </div>
                        <div>
                            <label class="text-[11px] font-bold text-slate-500 uppercase tracking-wider">Secondary Phone (Optional)</label>
                            <input type="tel" id="cust-sec-phone" autocomplete="off" class="w-full border border-slate-200 rounded-2xl p-3 text-xs sm:text-sm mt-1 bg-slate-50 focus:bg-white focus:outline-amber-500 transition font-medium text-slate-800">
                        </div>
                        <div>
                            <label class="text-[11px] font-bold text-slate-500 uppercase tracking-wider">Delivery Address *</label>
                            <textarea id="cust-address" autocomplete="off" class="w-full border border-slate-200 rounded-2xl p-3 text-xs sm:text-sm mt-1 bg-slate-50 focus:bg-white focus:outline-amber-500 transition font-medium text-slate-800" rows="2"></textarea>
                        </div>
                        <div>
                            <label class="text-[11px] font-bold text-slate-500 uppercase tracking-wider">Special Instructions / Notes</label>
                            <input type="text" id="cust-desc" autocomplete="off" class="w-full border border-slate-200 rounded-2xl p-3 text-xs sm:text-sm mt-1 bg-slate-50 focus:bg-white focus:outline-amber-500 transition font-medium text-slate-800">
                        </div>
                        <div class="pt-2 flex space-x-2">
                            <button onclick="switchTab('cart')" class="w-1/2 bg-slate-100 text-slate-700 py-3.5 rounded-2xl text-xs sm:text-sm font-semibold hover:bg-slate-200 transition">Back</button>
                            <button onclick="submitOrderToSheet()" class="w-1/2 bg-amber-500 text-slate-950 py-3.5 rounded-2xl text-xs sm:text-sm font-bold shadow hover:bg-amber-400 transition">Place Order</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function submitOrderToSheet() {
            const name = document.getElementById('cust-name').value.trim();
            const phone = document.getElementById('cust-phone').value.trim();
            const secPhone = document.getElementById('cust-sec-phone').value.trim();
            const address = document.getElementById('cust-address').value.trim();
            const desc = document.getElementById('cust-desc').value.trim();

            if (!name || !phone || !address) {
                showToast("Please fill in required fields.");
                return;
            }

            const itemsList = cart.map(item => `${getDisplayName(item)} (Qty: ${item.quantity}, ₹${(getProductPrice(item) * item.quantity).toFixed(2)})`).join(', ');
            const timestamp = new Date().toLocaleString();

            const orderPayload = {
                Type: "Order",
                Timestamp: timestamp,
                Customer_Name: name,
                Primary_Phone: phone,
                Items: itemsList,
                Address: address,
                Secondary_Phone: secPhone,
                Description: desc
            };

            showToast("Submitting order...");

            fetch(BASE_SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(orderPayload)
            }).then(() => {
                showToast("Order placed successfully!");
                cart = [];
                saveCart();
                updateCartBadge();
                prepareHomeProducts();
                switchTab('home');
            }).catch(err => {
                console.error("Error submitting order:", err);
                showToast("Order submitted!");
                cart = [];
                saveCart();
                updateCartBadge();
                prepareHomeProducts();
                switchTab('home');
            });
        }

        function increaseQuantity(productId) {
            const product = cachedProducts.find((p, index) => getProductId(p, index) === productId);
            if (!product) return;
            
            const existing = cart.find(i => getProductId(i) === productId);
            if (existing) {
                existing.quantity += 1;
            } else {
                cart.push({ ...product, quantity: 1 });
            }
            saveCart();
            updateCartBadge();
            renderContent();
            showToast(`Added ${getDisplayName(product)} to cart`);
        }

        function decreaseQuantity(productId) {
            const existingIndex = cart.findIndex(i => getProductId(i) === productId);
            if (existingIndex > -1) {
                cart[existingIndex].quantity -= 1;
                if (cart[existingIndex].quantity <= 0) {
                    cart.splice(existingIndex, 1);
                }
            }
            saveCart();
            updateCartBadge();
            renderContent();
        }

        function updateCartBadge() {
            const badge = document.getElementById('cart-badge');
            const totalCount = cart.reduce((sum, item) => sum + item.quantity, 0);
            if (totalCount > 0) {
                badge.innerText = totalCount;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        initApp();
    </script>
</body>
</html>
