<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ANU AARI MATERIALS</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
    </style>
    <!-- PWA Manifest Link -->
    <link rel="manifest" href="./manifest.json">
</head>
<body class="bg-slate-950 flex justify-center items-center h-[100dvh] w-screen overflow-hidden m-0">

    <!-- Mobile Frame Container -->
    <div class="w-full max-w-md h-[100dvh] sm:h-[850px] sm:rounded-3xl sm:shadow-2xl bg-zinc-50 flex flex-col justify-between relative overflow-hidden border border-zinc-800">

        <!-- TOP HEADER -->
        <header id="app-header" class="bg-gradient-to-r from-rose-700 to-pink-700 text-white p-3 flex justify-between items-center shadow-md z-30 shrink-0 hidden">
            <div class="flex items-center space-x-2.5 overflow-hidden">
                <button id="header-back-btn" onclick="handleHeaderBack()" class="w-7 h-7 rounded-xl bg-white/20 flex items-center justify-center text-white hover:bg-white/30 transition hidden shrink-0">
                    <i class="fa-solid fa-arrow-left text-xs"></i>
                </button>
                <div class="truncate">
                    <h1 id="header-title" class="text-xs font-bold tracking-widest uppercase truncate">ANU AARI MATERIALS</h1>
                    <a id="header-phone" href="tel:9840450113" class="text-[11px] text-pink-100 flex items-center space-x-1 mt-0.5 hover:underline font-medium">
                        <i class="fa-solid fa-phone text-[10px]"></i>
                        <span>9840450113</span>
                    </a>
                </div>
            </div>
            <button onclick="logout()" class="text-[11px] bg-white/20 px-3 py-1.5 rounded-xl text-white hover:bg-white/30 transition font-medium backdrop-blur-sm shrink-0 ml-2">
                <i class="fa-solid fa-right-from-bracket mr-1"></i> Logout
            </button>
        </header>

        <!-- SEARCH BAR -->
        <div id="search-container" class="bg-gradient-to-r from-rose-700 to-pink-700 px-3 pb-3 pt-0.5 z-30 shrink-0 hidden shadow-md">
            <div class="relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-zinc-400">
                    <i class="fa-solid fa-search text-xs"></i>
                </span>
                <input type="text" id="search-input" oninput="handleSearch(this.value)" placeholder="Search aari materials, beads, threads..." class="w-full pl-10 pr-4 py-2 bg-white/95 rounded-2xl text-xs focus:outline-none shadow-sm text-zinc-800 placeholder-zinc-400 font-medium">
            </div>
        </div>

        <!-- STABLE SUB-HEADER BAR -->
        <div id="subheader-container" class="bg-zinc-100 border-b border-zinc-200 px-3 py-2 z-20 shrink-0 hidden flex items-center justify-between shadow-sm">
            <button onclick="handleHeaderBack()" class="text-xs text-rose-600 font-bold flex items-center space-x-1 hover:underline">
                <i class="fa-solid fa-arrow-left"></i>
                <span id="subheader-back-text">Back</span>
            </button>
            <span id="subheader-title" class="text-xs font-bold text-zinc-700 uppercase truncate ml-2"></span>
        </div>

        <!-- MAIN SCROLLABLE CONTENT AREA -->
        <main id="main-content" class="flex-1 overflow-y-auto p-3 pt-2 bg-zinc-100/70">
            <!-- Welcome Loading Screen -->
            <div class="flex flex-col items-center justify-center h-full text-center space-y-4 px-6">
                <div class="w-14 h-14 bg-rose-100 rounded-2xl flex items-center justify-center text-rose-600 shadow-sm">
                    <i class="fa-solid fa-store text-xl"></i>
                </div>
                <div class="space-y-1">
                    <h2 class="text-xs font-bold text-zinc-800 tracking-wider">WELCOME TO ANU AARI MATERIALS</h2>
                    <p class="text-[11px] text-zinc-500 font-medium">LOADING STORE...</p>
                </div>
                <div class="w-6 h-6 border-2 border-rose-600 border-t-transparent rounded-full animate-spin mt-2"></div>
            </div>
        </main>

        <!-- FLOATING TOAST NOTIFICATION -->
        <div id="toast" class="absolute bottom-20 left-1/2 transform -translate-x-1/2 bg-zinc-900 text-white text-xs px-4 py-2.5 rounded-2xl shadow-xl transition-all duration-300 opacity-0 pointer-events-none z-50 font-medium border border-zinc-800">
            Notification message
        </div>

        <!-- BOTTOM NAVIGATION BAR -->
        <nav id="bottom-nav" class="bg-white/95 backdrop-blur-md border-t border-zinc-200 flex justify-around items-center h-16 shadow-2xl z-30 shrink-0 hidden">
            <button onclick="switchTab('home')" id="nav-home" class="flex flex-col items-center text-rose-600 transition">
                <i class="fa-solid fa-house text-lg"></i>
                <span class="text-[10px] mt-1 font-semibold">Home</span>
            </button>
            <button onclick="switchTab('categories')" id="nav-categories" class="flex flex-col items-center text-zinc-400 hover:text-rose-600 transition">
                <i class="fa-solid fa-layer-group text-lg"></i>
                <span class="text-[10px] mt-1 font-semibold">Categories</span>
            </button>
            <button onclick="switchTab('cart')" id="nav-cart" class="flex flex-col items-center text-zinc-400 hover:text-rose-600 transition relative">
                <i class="fa-solid fa-cart-shopping text-lg"></i>
                <span class="text-[10px] mt-1 font-semibold">Cart</span>
                <span id="cart-badge" class="absolute -top-1 right-2 bg-rose-600 text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-bold hidden shadow-sm">0</span>
            </button>
        </nav>

    </div>

    <!-- PRODUCT IMAGE MODAL -->
    <div id="image-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4" onclick="closeImageModal()">
        <div class="bg-white rounded-3xl max-w-xs w-full p-5 relative text-center shadow-2xl border border-zinc-100" onclick="event.stopPropagation()">
            <button onclick="closeImageModal()" class="absolute top-3 right-4 text-zinc-400 hover:text-zinc-600 text-sm w-7 h-7 rounded-full bg-zinc-100 flex items-center justify-center transition">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <img id="modal-img" src="" class="w-full h-56 object-cover rounded-2xl mb-4 bg-zinc-50 shadow-inner" onerror="this.src='https://placehold.co/400x300/fecdd3/e11d48?text=ANU+AARI';">
            <h3 id="modal-title" class="text-xs font-bold text-zinc-800 mb-1 leading-snug text-center"></h3>
            <p id="modal-id" class="text-[10px] text-zinc-400 mb-3 font-mono text-center"></p>
            <span id="modal-price" class="text-rose-600 font-extrabold text-sm block text-center"></span>
        </div>
    </div>

    <!-- JAVASCRIPT APP LOGIC -->
    <script>
        const BASE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyftApEC3eQJvJPF0tCSX7eFwAG52IinpEhQtlxhmVaOtpbc1J83zJZIhs9XRDRCezCZA/exec";
        const GOOGLE_SCRIPT_URL = `${BASE_SCRIPT_URL}?v=${Date.now()}`;

        let currentTab = 'home';
        let cart = []; 
        let selectedSubcategoryFilter = 'All';
        let selectedCategory = null;
        let selectedSubcategory = null;
        let searchQuery = '';
        
        let cachedProducts = [];
        let cachedCategories = [];
        let cachedLogins = [];
        let shuffledHomeProducts = [];
        let currentUser = null;

        function resolveImageUrl(imageName) {
            if (!imageName || String(imageName).trim() === '') {
                return 'https://placehold.co/400x300/fecdd3/e11d48?text=ANU+AARI';
            }
            
            let clean = String(imageName).trim();
            if (clean.startsWith('http://') || clean.startsWith('https://')) {
                return clean;
            }
            if (!clean.startsWith('images/') && !clean.startsWith('./images/')) {
                clean = 'images/' + clean;
            }
            return encodeURI(clean);
        }

        function getProductId(product) {
            return product.id || product.Item_ID || product.item_id || product.ID || "";
        }

        function getDisplayName(product) {
            return product.product || product.Products || product.PRODUCT || product.productName || product.name || product.Name || product.subcategory || product.Subcategory || getProductId(product) || "Item";
        }

        function getProductPrice(product) {
            const raw = product.price !== undefined ? product.price : (product['Price (INR)'] !== undefined ? product['Price (INR)'] : (product.Price !== undefined ? product.Price : 0));
            const num = parseFloat(raw);
            return isNaN(num) ? 0 : num;
        }

        function getProductSubcategory(product) {
            return product.subcategory || product.Subcategory || product.SUBCATEGORY || "";
        }

        function getProductCategory(product) {
            return product.category || product.Category || product.CATEGORY || "";
        }

        function getProductImage(product) {
            return product.image || product.images || product.Images || product.IMAGE || "";
        }

        function initApp() {
            const timeoutId = setTimeout(() => {
                const container = document.getElementById('main-content');
                if (container && container.innerHTML.includes('animate-spin')) {
                    container.innerHTML = `
                        <div class="flex flex-col items-center justify-center h-full text-center text-amber-600 text-xs p-6 space-y-3">
                            <i class="fa-solid fa-triangle-exclamation text-2xl"></i>
                            <p class="font-bold">Connection is taking longer than expected.</p>
                            <button onclick="initApp()" class="mt-2 bg-rose-600 text-white px-4 py-2 rounded-2xl font-semibold shadow-sm hover:bg-rose-700 transition">Retry Connection</button>
                        </div>
                    `;
                }
            }, 20000);

            fetch(GOOGLE_SCRIPT_URL)
                .then(res => res.json())
                .then(data => {
                    clearTimeout(timeoutId);
                    if (data.status === "success") {
                        cachedProducts = data.products || [];
                        cachedCategories = data.categories || [];
                        cachedLogins = data.logins || [];
                        
                        const savedUser = localStorage.getItem('anu_aari_user');
                        if (savedUser) {
                            currentUser = JSON.parse(savedUser);
                            loadUserCart();
                            showAppUI();
                        } else {
                            renderLoginScreen(false);
                        }
                    } else {
                        document.getElementById('main-content').innerHTML = `
                            <div class="flex flex-col items-center justify-center h-full text-center text-red-500 text-xs p-6">
                                <i class="fa-solid fa-triangle-exclamation text-2xl mb-2"></i>
                                <p>Error loading sheet data: ${data.message}</p>
                                <button onclick="initApp()" class="mt-2 bg-rose-600 text-white px-4 py-2 rounded-2xl font-semibold shadow-sm">Retry</button>
                            </div>
                        `;
                    }
                })
                .catch(err => {
                    clearTimeout(timeoutId);
                    console.error("Failed to load from sheet:", err);
                    document.getElementById('main-content').innerHTML = `
                        <div class="flex flex-col items-center justify-center h-full text-center text-red-500 text-xs p-6">
                            <i class="fa-solid fa-triangle-exclamation text-2xl mb-2"></i>
                            <p>Failed to connect to Google Sheet. Please check your connection or URL.</p>
                            <button onclick="initApp()" class="mt-2 bg-rose-600 text-white px-4 py-2 rounded-2xl font-semibold shadow-sm">Retry</button>
                        </div>
                    `;
                });
        }

        function loadUserCart() {
            if (!currentUser || !currentUser.mobile) {
                cart = [];
                return;
            }
            const savedCart = localStorage.getItem(`anu_aari_cart_${currentUser.mobile}`); if (savedCart) { try { cart = JSON.parse(savedCart); } catch (e) { cart = []; } } else { cart = []; } updateCartBadge(); }  function saveUserCart() { if (!currentUser \vert{}\vert{} !currentUser.mobile) return; localStorage.setItem(`anu_aari_cart_${currentUser.mobile}`, JSON.stringify(cart));
        }

        function renderLoginScreen(isSignup = false) {
            document.getElementById('app-header').classList.add('hidden');
            document.getElementById('search-container').classList.add('hidden');
            document.getElementById('subheader-container').classList.add('hidden');
            document.getElementById('bottom-nav').classList.add('hidden');

            const container = document.getElementById('main-content');
            container.innerHTML = `
                <div class="flex flex-col justify-center h-full px-6 space-y-4">
                    <div class="text-center space-y-1 mb-1">
                        <div class="w-16 h-16 bg-rose-100 rounded-3xl flex items-center justify-center text-rose-600 mx-auto mb-3 shadow-sm">
                            <i class="fa-solid ${isSignup ? 'fa-user-plus' : 'fa-lock'} text-xl"></i>
                        </div>
                        <h2 class="text-sm font-bold text-zinc-900 tracking-wider">${isSignup ? 'CREATE ACCOUNT' : 'MEMBER LOGIN'}</h2>
                        <p class="text-[11px] text-zinc-500 font-medium">${isSignup ? 'Sign up to create your account' : 'Enter your mobile number and password'}</p>
                    </div>
                    <div class="space-y-3.5 bg-white p-6 rounded-3xl shadow-sm border border-zinc-200/80">
                        ${
