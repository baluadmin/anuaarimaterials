<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ANU AARI MATERIALS</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
        .hd-banner {
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
        }
    </style>
    <!-- PWA Manifest Link -->
    <link rel="manifest" href="./manifest.json">
</head>
<body class="bg-gradient-to-b from-sky-50 via-slate-50 to-blue-50 flex justify-center items-center h-[100dvh] w-screen overflow-hidden m-0">

    <!-- Mobile Frame Container -->
    <div class="w-full max-w-md h-[100dvh] sm:h-[850px] sm:rounded-3xl sm:shadow-2xl bg-white flex flex-col justify-between relative overflow-hidden border border-slate-200 text-slate-800">

        <!-- TOP BANNER AREA -->
        <header id="app-header" class="bg-amber-500 text-slate-950 p-2 pb-0 flex flex-col shadow-md z-30 shrink-0">
            <!-- FULL WIDTH HD BANNER CONTAINER -->
            <div class="w-full relative rounded-xl overflow-hidden shadow-sm bg-white border border-amber-600/30 h-36 flex items-center justify-center">
                <img src="images/banner1.png" alt="Store Banner" class="w-full h-full object-cover hd-banner" onerror="this.src='https://placehold.co/800x300/ffffff/d97706?text=ANU+AARI+MATERIALS';">
            </div>
            <!-- Hidden elements for script state -->
            <button id="header-back-btn" onclick="handleHeaderBack()" class="hidden"></button>
            <h1 id="header-title" class="hidden"></h1>
            <a id="header-phone" class="hidden"></a>
        </header>

        <!-- SEARCH BAR -->
        <div id="search-container" class="bg-amber-500 px-3 pb-3 pt-2 z-30 shrink-0 shadow-md">
            <div class="relative">
                <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-zinc-400">
                    <i class="fa-solid fa-search text-xs"></i>
                </span>
                <input type="text" id="search-input" oninput="handleSearch(this.value)" placeholder="Search aari materials, beads, threads..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" class="w-full pl-10 pr-10 py-2 bg-white/95 border border-amber-600/30 rounded-2xl text-xs focus:outline-none shadow-sm text-slate-800 placeholder-zinc-400 font-medium">
                <button id="search-clear-btn" onclick="clearSearch()" class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-zinc-400 hover:text-zinc-600 hidden">
                    <i class="fa-solid fa-xmark text-xs"></i>
                </button>
            </div>
        </div>

        <!-- STABLE SUB-HEADER BAR -->
        <div id="subheader-container" class="bg-slate-50 border-b border-slate-200 px-3 py-2 z-20 shrink-0 hidden flex items-center justify-between shadow-sm">
            <button onclick="handleHeaderBack()" class="text-xs text-amber-600 font-bold flex items-center space-x-1 hover:underline">
                <i class="fa-solid fa-arrow-left"></i>
