<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owner Dashboard - Store Admin</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 flex justify-center items-center h-screen m-0">

    <!-- Mobile / Admin Frame Container -->
    <div class="w-full max-w-md h-full sm:h-[850px] sm:rounded-3xl sm:shadow-2xl bg-white flex flex-col relative overflow-hidden">

        <!-- ================= VIEW 1: OWNER PIN LOGIN ================= -->
        <div id="owner-login-view" class="flex-1 flex flex-col justify-center p-6 bg-gradient-to-br from-purple-900 to-indigo-900 text-white">
            <div class="text-center mb-6">
                <div class="w-16 h-16 bg-white/10 rounded-2xl flex items-center justify-center mx-auto mb-3 backdrop-blur-md">
                    <i class="fa-solid fa-user-shield text-3xl text-purple-300"></i>
                </div>
                <h1 class="text-2xl font-bold">Owner Portal 🛡️</h1>
                <p class="text-xs text-purple-200 mt-1">Restricted access. Enter your admin PIN to manage inventory.</p>
            </div>

            <form onsubmit="handleOwnerLogin(event)" class="space-y-4 bg-white/10 p-5 rounded-2xl backdrop-blur-md border border-white/10">
                <div>
                    <label class="block text-xs font-semibold text-purple-200 mb-1">Admin Master PIN</label>
                    <input type="password" id="ownerPinInput" required maxlength="6" placeholder="Enter PIN (e.g., 7777)" class="w-full px-4 py-3 bg-black/20 border border-white/20 rounded-xl text-center text-lg tracking-widest font-bold text-white placeholder-purple-300/50 focus:outline-none focus:border-purple-400">
                </div>
                <button type="submit" class="w-full bg-purple-600 hover:bg-purple-500 text-white py-3.5 rounded-xl font-semibold shadow-lg transition text-sm">
                    Unlock Dashboard
                </button>
            </form>
            <div class="text-center mt-6">
                <span class="text-[11px] text-purple-300">Secure Admin Panel v1.1</span>
            </div>
        </div>


        <!-- ================= VIEW 2: OWNER DASHBOARD (Hidden until login) ================= -->
        <div id="owner-dashboard-view" class="flex-1 flex flex-col relative overflow-hidden hidden">

            <!-- HEADER -->
            <header class="bg-purple-700 text-white p-4 flex justify-between items-center shadow-md z-10">
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-gauge-high"></i>
                    <h1 class="text-lg font-bold">Owner Dashboard</h1>
                </div>
                <button onclick="lockOwnerApp()" class="text-xs bg-purple-800 px-3 py-1.5 rounded-full font-semibold hover:bg-purple-900 transition">
                    <i class="fa-solid fa-lock mr-1"></i> Lock
                </button>
            </header>

            <!-- SCROLLABLE CONTENT -->
            <main class="flex-1 overflow-y-auto p-4 space-y-4 pb-12">
                
                <!-- Quick Stats -->
                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-purple-50 p-3 rounded-2xl border border-purple-200 text-center">
                        <i class="fa-solid fa-box-open text-xl text-purple-600 mb-1"></i>
                        <h4 class="text-[11px] font-semibold text-purple-700">Total Products</h4>
                        <p id="stat-total" class="text-lg font-bold text-gray-800">0</p>
                    </div>
                    <div class="bg-indigo-50 p-3 rounded-2xl border border-indigo-200 text-center">
                        <i class="fa-solid fa-folder-tree text-xl text-indigo-600 mb-1"></i>
                        <h4 class="text-[11px] font-semibold text-indigo-700">Categories</h4>
                        <p id="stat-cats" class="text-lg font-bold text-gray-800">0</p>
                    </div>
                </div>

                <!-- 1. ADD NEW CATEGORY CARD -->
                <div class="bg-white border border-gray-200 p-4 rounded-2xl shadow-sm">
                    <h4 class="font-bold text-gray-800 text-sm mb-2 flex items-center">
                        <i class="fa-solid fa-folder-plus text-purple-600 mr-2"></i> Add New Category
                    </h4>
                    <form onsubmit="addNewCategory(event)" class="flex gap-2">
                        <input type="text" id="newCatName" required placeholder="E.g., Aari Materials" class="flex-1 px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl text-xs focus:outline-none focus:border-purple-600">
                        <button type="submit" class="bg-purple-600 hover:bg-purple-700 text-white px-4 py-2 rounded-xl font-semibold shadow transition text-xs">
                            Add
                        </button>
                    </form>
                </div>

                <!-- 2. ADD NEW PRODUCT CARD -->
                <div class="bg-white border border-gray-200 p-4 rounded-2xl shadow-sm">
                    <h4 class="font-bold text-gray-800 text-sm mb-3 flex items-center">
                        <i class="fa-solid fa-circle-plus text-purple-600 mr-2"></i> Add New Product
                    </h4>
                    <form onsubmit="addNewProduct(event)" class="space-y-3">
                        <div>
                            <label class="block text-[11px] font-semibold text-gray-600 mb-1">Product Name</label>
                            <input type="text" id="prodName" required placeholder="E.g., Silk Thread" class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl text-xs focus:outline-none focus:border-purple-600">
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-[11px] font-semibold text-gray-600 mb-1">Price ($)</label>
                                <input type="number" step="0.01" id="prodPrice" required placeholder="19.99" class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl text-xs focus:outline-none focus:border-purple-600">
                            </div>
                            <div>
                                <label class="block text-[11px] font-semibold text-gray-600 mb-1">Category</label>
                                <!-- Dynamically populated category dropdown -->
                                <select id="prodCategory" class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl text-xs focus:outline-none focus:border-purple-600">
                                    <!-- Options injected via JS -->
                                </select>
                            </div>
                        </div>
                        <div>
                            <label class="block text-[11px] font-semibold text-gray-600 mb-1">Product Image Link (URL)</label>
                            <input type="url" id="prodImage" required placeholder="Paste image link here..." class="w-full px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl text-xs focus:outline-none focus:border-purple-600">
                        </div>
                        <button type="submit" class="w-full bg-purple-600 hover:bg-purple-700 text-white py-2.5 rounded-xl font-semibold shadow transition text-xs">
                            Publish to Store
                        </button>
                    </form>
                </div>

                <!-- Product Inventory List -->
                <div>
                    <h4 class="font-bold text-gray-800 text-sm mb-2 flex justify-between items-center">
                        <span>Managed Inventory</span>
                        <span id="inventory-count" class="text-xs text-purple-600 font-semibold"></span>
                    </h4>
                    <div id="product-list-container" class="space-y-2">
                        <!-- Dynamically populated product items -->
                    </div>
                </div>

            </main>
        </div>

    </div>

    <!-- JAVASCRIPT ADMIN LOGIC -->
    <script>
        const MASTER_PIN = "7777";

        // Initial Categories (saved in localStorage)
        let ownerCategories = JSON.parse(localStorage.getItem('owner_categories')) || [
            'Electronics', 'Fashion', 'Home', 'Groceries'
        ];

        // Initial Products (saved in localStorage)
        let ownerProducts = JSON.parse(localStorage.getItem('owner_products')) || [
            { id: 1, name: 'Wireless Earbuds', price: 49.99, category: 'Electronics', image: 'https://images.unsplash.com/photo-1590658268037-6bf12165a8df?w=300' },
            { id: 2, name: 'Smart Fitness Watch', price: 89.99, category: 'Electronics', image: 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=300' }
        ];

        function handleOwnerLogin(event) {
            event.preventDefault();
            const enteredPin = document.getElementById('ownerPinInput').value.trim();

            if (enteredPin === MASTER_PIN) {
                document.getElementById('owner-login-view').classList.add('hidden');
                document.getElementById('owner-dashboard-view').classList.remove('hidden');
                refreshDashboard();
            } else {
                alert("Incorrect Admin PIN! Try 7777");
                document.getElementById('ownerPinInput').value = '';
            }
        }

        function lockOwnerApp() {
            document.getElementById('owner-dashboard-view').classList.add('hidden');
            document.getElementById('owner-login-view').classList.remove('hidden');
            document.getElementById('ownerPinInput').value = '';
        }

        function refreshDashboard() {
            document.getElementById('stat-total').innerText = ownerProducts.length;
            document.getElementById('stat-cats').innerText = ownerCategories.length;
            renderCategoryDropdown();
            renderInventory();
        }

        function renderCategoryDropdown() {
            const select = document.getElementById('prodCategory');
            select.innerHTML = ownerCategories.map(cat => `
                <option value="${cat}">${cat}</option>
            `).join('');
        }

        function addNewCategory(event) {
            event.preventDefault();
            const catName = document.getElementById('newCatName').value.trim();

            if (catName && !ownerCategories.includes(catName)) {
                ownerCategories.push(catName);
                localStorage.setItem('owner_categories', JSON.stringify(ownerCategories));
                document.getElementById('newCatName').value = '';
                refreshDashboard();
                alert(`Category "${catName}" added successfully!`);
            } else {
                alert("Category already exists or is empty.");
            }
        }

        function renderInventory() {
            const container = document.getElementById('product-list-container');
            document.getElementById('inventory-count').innerText = `(${ownerProducts.length} items)`;

            if (ownerProducts.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-6 text-gray-400 bg-white border border-gray-200 rounded-2xl">
                        <i class="fa-solid fa-box-open text-3xl mb-2"></i>
                        <p class="text-xs">No products in inventory yet.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = ownerProducts.map((p) => `
                <div class="flex items-center justify-between bg-white border border-gray-200 p-3 rounded-xl shadow-sm">
                    <div class="flex items-center space-x-3">
                        <img src="${p.image}" class="w-12 h-12 object-cover rounded-lg">
                        <div>
                            <h5 class="text-xs font-bold text-gray-800">${p.name}</h5>
                            <span class="text-[11px] text-purple-600 font-semibold">$${p.price.toFixed(2)} • ${p.category}</span>
                        </div>
                    </div>
                    <button onclick="deleteOwnerProduct(${p.id})" class="text-red-500 hover:text-red-700 p-2 transition" title="Delete product">
                        <i class="fa-solid fa-trash text-xs"></i>
                    </button>
                </div>
            `).join('');
        }

        function addNewProduct(event) {
            event.preventDefault();
            const name = document.getElementById('prodName').value.trim();
            const price = parseFloat(document.getElementById('prodPrice').value);
            const category = document.getElementById('prodCategory').value;
            const image = document.getElementById('prodImage').value.trim();

            const newProd = {
                id: Date.now(),
                name,
                price,
                category,
                image
            };

            ownerProducts.push(newProd);
            localStorage.setItem('owner_products', JSON.stringify(ownerProducts));
            refreshDashboard();
            
            // Clear inputs
            document.getElementById('prodName').value = '';
            document.getElementById('prodPrice').value = '';
            document.getElementById('prodImage').value = '';
            alert("Product published successfully!");
        }

        function deleteOwnerProduct(id) {
            if (confirm("Are you sure you want to delete this product?")) {
                ownerProducts = ownerProducts.filter(p => p.id !== id);
                localStorage.setItem('owner_products', JSON.stringify(ownerProducts));
                refreshDashboard();
            }
        }
    </script>
</body>
</html>
